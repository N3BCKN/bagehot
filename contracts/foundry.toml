[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
cache_path = "cache"

# Pinned toolchain — see docs/dependencies.md. ADR-018 (P04) records the choice of 0.8.28.
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false

# spec/ holds the shared JSON vectors, config/ the per-chain address files, both read-only.
# deployments/ is the only writable path: deploy scripts emit manifests there.
fs_permissions = [
    { access = "read", path = "../spec" },
    { access = "read", path = "../config" },
    { access = "read-write", path = "../deployments" },
    { access = "read-write", path = "./cache" }, # test-only: the manifest round-trip test (P18)
]

[fuzz]
runs = 1024
max_test_rejects = 200000

[invariant]
runs = 256
depth = 200
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

[profile.nightly.fuzz]
runs = 50000

[profile.nightly.invariant]
runs = 4096
depth = 500
fail_on_revert = false

[rpc_endpoints]
base = "${BASE_ARCHIVE_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "attributes_first"
sort_imports = true
wrap_comments = true

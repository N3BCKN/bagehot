[project]
name = "bagehot"
version = "0.0.0"
description = "Testnet-only CDP research protocol: risk parameters and a liquidation-mechanism comparison"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "scipy==1.15.3",
    "arch==7.2.0",
    "web3==7.8.0",
    "eth-abi==5.2.0",
    "httpx==0.28.1",
    "pyyaml==6.0.2",
    "pydantic==2.10.6",
    "matplotlib==3.10.0",
    "psycopg[binary]==3.2.4",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "hypothesis==6.125.1",
    "ruff==0.9.6",
]

# Virtual project: the top-level packages (model/, agents/, paths/, experiments/, data/,
# differential/, bot/, indexer/) are run with `uv run python -m <pkg>` from the repo root,
# which puts the root on sys.path. Nothing is installed into site-packages.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# .claude/hooks/ is human-maintained and protected from edits; ruff must not rewrite it.
extend-exclude = [".claude", "contracts/lib", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: long-running test, excluded from `just py-test`",
    "network: needs network or an RPC endpoint, excluded from `just py-test`",
    "fork: needs a local anvil fork of Base, excluded from `just py-test`",
]
